spring:
  application:
    name: courtly-notifications

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: courtly-notifications
      # a brand new group starts from the oldest event, not just new ones
      auto-offset-reset: earliest

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  events:
    topic: ${BOOKING_EVENTS_TOPIC:courtly.booking-events}
  mail:
    from: ${MAIL_FROM:Courtly <no-reply@courtly.local>}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
