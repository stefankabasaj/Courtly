spring:
  application:
    name: courtly

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:courtly}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CourtlyHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: courtly
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: courtly
    default-schema: courtly
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # failed logins before 429 - see LoginAttemptService
  security:
    login:
      max-failures-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:5}
      max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
      window: ${LOGIN_FAILURE_WINDOW:15m}
  # opening hours - bookings must fit inside them (closing-hour 24 = until midnight)
  courts:
    opening-hour: ${COURTS_OPENING_HOUR:7}
    closing-hour: ${COURTS_CLOSING_HOUR:23}
  # admin account created at startup - see AdminBootstrap
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # unpaid PENDING bookings are cancelled after payment-timeout - see BookingExpiryJob
  booking:
    payment-timeout: ${BOOKING_PAYMENT_TIMEOUT:15m}
    expiry-check-interval-ms: ${BOOKING_EXPIRY_CHECK_INTERVAL_MS:60000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

info:
  app:
    name: courtly
    version: 1.0.0

logging:
  level:
    com.stefankabasaj.courtly: INFO
    org.springframework.security: WARN
