spring:
  application:
    name: courtly

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:courtly}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CourtlyHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        # fail a send after 5s instead of blocking a minute when Kafka is down -
        # OutboxPublisher just tries again on the next run
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: courtly
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: courtly
    default-schema: courtly
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # two threads: OutboxPublisher can wait on Kafka for a few seconds, and that
  # shouldn't hold up BookingExpiryJob behind it
  task:
    scheduling:
      pool:
        size: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # failed logins before 429 - see LoginAttemptService
  security:
    login:
      max-failures-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:5}
      max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
      window: ${LOGIN_FAILURE_WINDOW:15m}
  # opening hours - bookings must fit inside them (closing-hour 24 = until midnight)
  courts:
    opening-hour: ${COURTS_OPENING_HOUR:7}
    closing-hour: ${COURTS_CLOSING_HOUR:23}
  # for a frontend on another origin during development, e.g. http://localhost:3000.
  # comma-separated; empty = CORS off
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # admin account created at startup - see AdminBootstrap
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # booking events go through the outbox to this topic - see OutboxPublisher
  events:
    topic: ${BOOKING_EVENTS_TOPIC:courtly.booking-events}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:1000}
  # unpaid PENDING bookings are cancelled after payment-timeout - see BookingExpiryJob
  booking:
    payment-timeout: ${BOOKING_PAYMENT_TIMEOUT:15m}
    expiry-check-interval-ms: ${BOOKING_EXPIRY_CHECK_INTERVAL_MS:60000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: courtly
    distribution:
      # buckets, so Grafana can work out p95 latency across both instances
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      # DB/disk details only for admins - every logged-in user counts as "authorized" otherwise
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true

info:
  app:
    name: courtly
    version: 1.0.0

logging:
  pattern:
    # every line a request causes carries its id - see RequestIdFilter
    correlation: "[%X{requestId:-}] "
  level:
    com.stefankabasaj.courtly: INFO
    org.springframework.security: WARN
