# Production-only overrides for application.yml
# Activate with SPRING_PROFILES_ACTIVE=prod

spring:
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    com.stefankabasaj.courtly: INFO
    org.hibernate: WARN
