# Load balancer in front of the app replicas (docker-compose.yml runs two).
# Docker's DNS returns every "app" container for that name, and nginx
# round-robins between them.
upstream courtly_app {
    server app:8080;
}

# upstream_addr in the access log shows which replica served each request
log_format upstream '$remote_addr "$request" $status -> $upstream_addr';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://courtly_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # overwrite, don't append: nginx is the first hop, so anything the
        # client sent in this header is made up (and would let it dodge the
        # per-IP login limit)
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
