# Load balancer in front of the app replicas (docker-compose.yml runs two).
# Docker's DNS returns every "app" container for that name, and nginx
# round-robins between them. The name is looked up again every few seconds
# (resolver + a variable in proxy_pass), so recreating the app containers -
# which gives them new IPs - doesn't need an nginx restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# upstream_addr in the access log shows which replica served each request
log_format upstream '$remote_addr "$request" $status -> $upstream_addr';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    # Prometheus scrapes the replicas directly; metrics aren't for the outside world
    location = /actuator/prometheus {
        return 404;
    }

    location / {
        set $courtly_app http://app:8080;
        proxy_pass $courtly_app;
        # nginx's own per-request id; the app logs it and sends it back (RequestIdFilter)
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # overwrite, don't append: nginx is the first hop, so anything the
        # client sent in this header is made up (and would let it dodge the
        # per-IP login limit)
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
