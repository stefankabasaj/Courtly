name: CI

# The Maven project lives in Courtly/, but GitHub only picks up workflows from
# the repo root's .github/workflows - hence working-directory below.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Courtly

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            Courtly/pom.xml
            Courtly/notification-service/pom.xml

      - name: Run tests
        run: ./mvnw test -B --no-transfer-progress

      - name: Run notification service tests
        working-directory: Courtly/notification-service
        run: ./mvnw test -B --no-transfer-progress

      - name: Build JAR
        run: ./mvnw package -DskipTests -B --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            Courtly/target/surefire-reports/
            Courtly/notification-service/target/surefire-reports/
          retention-days: 7

      - name: Build Docker image
        run: docker build -t courtly:${{ github.sha }} .

  smoke-test:
    name: Smoke test (full stack)
    runs-on: ubuntu-latest
    needs: build-and-test

    defaults:
      run:
        working-directory: Courtly

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the whole docker compose stack: real PostgreSQL migrations, Redis, Kafka,
      # both app replicas behind nginx, and the emails in Mailpit
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
