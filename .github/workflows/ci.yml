name: CI

# The Maven project lives in the Courtly/ subfolder. GitHub only runs workflows
# from the repository root's .github/workflows, so this file has to live here
# (it used to sit in Courtly/.github and never ran).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Courtly

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Courtly/pom.xml

      - name: Run tests
        run: ./mvnw test -B --no-transfer-progress

      - name: Build JAR
        run: ./mvnw package -DskipTests -B --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Courtly/target/surefire-reports/
          retention-days: 7

      - name: Build Docker image
        run: docker build -t courtly:${{ github.sha }} .
